<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Ми переїхали</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111111);
      --hint: var(--tg-theme-hint-color, #8a8a8e);
      --btn: var(--tg-theme-button-color, #2ea6ff);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --card: var(--tg-theme-secondary-bg-color, #f1f1f4);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-tg]) { --bg: #17212b; --text: #f5f5f5; --hint: #8b9aa7; --card: #232e3c; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      text-align: center;
    }
    .wrap { width: 100%; max-width: 380px; }
    .plane { font-size: 84px; line-height: 1; animation: fly 2.6s ease-in-out infinite; }
    @keyframes fly { 0%, 100% { transform: translate(0, 0) rotate(-6deg); } 50% { transform: translate(10px, -12px) rotate(4deg); } }
    @media (prefers-reduced-motion: reduce) { .plane { animation: none; } }
    h1 { font-size: 30px; margin: 18px 0 8px; letter-spacing: -0.5px; }
    .card { background: var(--card); border-radius: 18px; padding: 18px 16px; margin: 18px 0; }
    .label { color: var(--hint); font-size: 14px; }
    .bot { display: inline-block; margin-top: 4px; font-size: 24px; font-weight: 700; color: var(--btn); text-decoration: none; word-break: break-all; }
    p { margin: 0; color: var(--hint); }
    .go {
      display: block; width: 100%; margin-top: 18px; padding: 16px; border: 0; border-radius: 14px;
      background: var(--btn); color: var(--btn-text); font: inherit; font-size: 17px; font-weight: 700;
      text-decoration: none; cursor: pointer;
    }
    .go:active { opacity: .85; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="plane" aria-hidden="true">🛩</div>
    <h1>Ми переїхали</h1>
    <div class="card">
      <div class="label">новий бот</div>
      <a class="bot js-go" href="https://t.me/%TO%">@%TO%</a>
    </div>
    <p>заходь, підписуйся на канал і грай</p>
    <a class="go js-go" href="https://t.me/%TO%">ПЕРЕЙТИ В @%TO%</a>
  </main>
  <script>
    (function () {
      var url = 'https://t.me/%TO%';
      var tg = window.Telegram && window.Telegram.WebApp;
      if (tg && tg.initData) document.documentElement.setAttribute('data-tg', '');
      function go(e) {
        if (tg && tg.openTelegramLink) { if (e) e.preventDefault(); try { tg.openTelegramLink(url); return; } catch (err) {} }
        window.location.href = url;
      }
      document.querySelectorAll('.js-go').forEach(function (a) { a.addEventListener('click', go); });
      if (tg) {
        try {
          tg.ready(); tg.expand();
          tg.MainButton.setText('ПЕРЕЙТИ В @%TO%');
          tg.MainButton.onClick(function () { go(); });
          tg.MainButton.show();
        } catch (err) {}
      }
    })();
  </script>
</body>
</html>
